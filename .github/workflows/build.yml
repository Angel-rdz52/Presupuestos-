name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Presupuesto-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Limpiar historial (dejar solo los 10 más recientes)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow "Build APK" --repo "$GITHUB_REPOSITORY" \
            --limit 100 --json databaseId --jq '.[10:][].databaseId' |
          while read -r id; do
            echo "Borrando run $id"
            gh run delete "$id" --repo "$GITHUB_REPOSITORY" || true
          done
